<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta
      name="description"
      content="Florería Valeria — arreglos florales artesanales, flores frescas y detalles únicos en Cocula, Jalisco. Entrega a domicilio todos los días."
    />
    <meta name="theme-color" content="#FBF5F4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1B0E14" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <title>%WEB_TITLE%</title>
    <!--
      Contraparte de public/404.html: si llegamos aquí con una ruta
      codificada en la query string (`/?/catalogo`), la restauramos como
      ruta limpia antes de que la app monte y lea window.location.
      Patrón estándar: https://github.com/rafgraph/spa-github-pages
    -->
    <script>
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Evita el destello de fondo claro antes de que React monte. */
      @media (prefers-color-scheme: dark) {
        html,
        body,
        #root {
          background-color: #1b0e14;
        }
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
